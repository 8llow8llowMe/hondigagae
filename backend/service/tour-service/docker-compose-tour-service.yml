# 혼디가개 tour-service 배포 정의.
#
# 배치:
#   dev  -> main-server (192.168.0.11), 호스트 포트 7082  (혼디가개 dev 는 7xxx 대역)
#   prod -> backend-1   (192.168.0.13), 호스트 포트 5082  (혼디가개 prod 는 5xxx 대역)
#
#   BossPickSeoul 이 dev 6xxx / prod 9xxx 를 이미 점유하고 있어 같은 호스트에 올리려면
#   대역을 달리해야 한다. (Infra README §4 배치 원칙 5번)
#   storage(192.168.0.12)에는 올리지 않는다 — 총 1.9GB / swap 0 에 nginx 가 함께 있어
#   OOM 이 나면 전 도메인의 인그레스가 같이 죽는다.
#
# 컨테이너 안에서 앱이 듣는 포트는 dev/prod 가 같다(8082). 호스트 포트만 다르다.
# 서비스 간 호출과 Eureka 등록은 같은 호스트의 8llow8llowme-net 브리지 안에서 컨테이너명으로 이뤄지므로,
# SERVICE_DISCOVERY_HOSTNAME 에는 사설 IP 가 아니라 discovery **컨테이너명**을 넣는다.

x-tour-service-environment: &tour_service_environment
  TIME_ZONE: ${TIME_ZONE}
  # prod 로 띄우면서 이 값이 dev 로 남아 있으면 ddl-auto:update 로
  # 운영 스키마가 배포마다 자동 변경된다. 환경별 Vault secret 에서 반드시 갈라 둔다.
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  SPRING_APPLICATION_NAME: ${TOUR_SERVICE_APP_NAME}
  TOUR_SERVICE_PORT: ${TOUR_SERVICE_PORT}
  # 같은 호스트 같은 브리지 안이라 컨테이너명으로 해석된다.
  # 예) dev = hondigagae-service-discovery-dev / prod = hondigagae-service-discovery-prod
  SERVICE_DISCOVERY_HOSTNAME: ${SERVICE_DISCOVERY_HOSTNAME}
  # 컨테이너 내부 포트(8761)다. 호스트 포트(7761/5761)가 아니다.
  SERVICE_DISCOVERY_PORT: ${SERVICE_DISCOVERY_PORT}
  TOUR_DB_URL: ${TOUR_DB_URL}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_MODE: ${REDIS_MODE}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  # sentinel 모드에서만 쓴다. standalone 이면 비워 둔다.
  # 노드는 host:port 콤마 구분. sentinel 인데 비어 있으면 RedisConfigurer 가 기동 시점에
  # 어떤 env 를 넣어야 하는지 적어 실패시킨다 — compose 가 넘기지 않으면 그 메시지가 나온다.
  REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-}
  REDIS_SENTINEL_NODES: ${REDIS_SENTINEL_NODES:-}
  # BossPickSeoul 과 같은 Redis 를 공유하므로 prefix 로 키 공간을 가른다.
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
  SNOWFLAKE_DATACENTER_ID: ${SNOWFLAKE_DATACENTER_ID}
  # 서비스마다 다른 값을 준다. 겹치면 같은 ID 가 두 번 나온다.
  SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID}
  # 기상청 단기예보. 공공데이터포털 "디코딩(원문)" 키를 그대로 넣는다 — 인코딩은 어댑터가 한다.
  # 관광공사(B551011) 키와 같은 키를 쓸 수 있음이 실호출로 확인돼 있다.
  # 비면 적합도(insight) 조회만 실패하고 나머지 API 는 정상 동작한다.
  KMA_API_SERVICE_KEY: ${KMA_API_SERVICE_KEY}
  KMA_API_BASE_URL: ${KMA_API_BASE_URL:-https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
  KMA_PUBLISH_DELAY_MINUTES: ${KMA_PUBLISH_DELAY_MINUTES:-10}
  KMA_STALE_CACHE_SECONDS: ${KMA_STALE_CACHE_SECONDS:-21600}
  # 아래 튠값은 재빌드 없이 Vault 값만 고쳐 조정하려고 env 로 뺀 것이다. yml 기본값과 같은 값을
  # 기본값으로 두었다 — compose 가 넘기지 않으면 Vault 를 바꿔도 컨테이너에는 도달하지 않는다.
  KMA_NUM_OF_ROWS: ${KMA_NUM_OF_ROWS:-1500}
  KMA_CACHE_GRACE_MINUTES: ${KMA_CACHE_GRACE_MINUTES:-30}
  KMA_GRID_COARSEN_FACTOR: ${KMA_GRID_COARSEN_FACTOR:-1}
  KMA_REFRESH_LOCK_SECONDS: ${KMA_REFRESH_LOCK_SECONDS:-10}
  # 중기예보 (D+5 ~ D+10). 같은 키를 쓴다.
  KMA_MID_TERM_BASE_URL: ${KMA_MID_TERM_BASE_URL:-https://apis.data.go.kr/1360000/MidFcstInfoService}
  KMA_MID_TERM_PUBLISH_DELAY_MINUTES: ${KMA_MID_TERM_PUBLISH_DELAY_MINUTES:-20}
  KMA_MID_TERM_STALE_CACHE_SECONDS: ${KMA_MID_TERM_STALE_CACHE_SECONDS:-129600}
  KMA_MID_TERM_CACHE_GRACE_MINUTES: ${KMA_MID_TERM_CACHE_GRACE_MINUTES:-60}
  # 기상특보. 활용신청이 안 된 키면 false 로 꺼 둔다 (켜 두면 10분마다 실패 로그만 쌓인다).
  KMA_WARNING_ENABLED: ${KMA_WARNING_ENABLED:-true}
  KMA_WARNING_BASE_URL: ${KMA_WARNING_BASE_URL:-https://apis.data.go.kr/1360000/WthrWrnInfoService}
  KMA_WARNING_NUM_OF_ROWS: ${KMA_WARNING_NUM_OF_ROWS:-20}
  KMA_WARNING_CACHE_SECONDS: ${KMA_WARNING_CACHE_SECONDS:-600}
  KMA_WARNING_STATION_ID: ${KMA_WARNING_STATION_ID:-184}
  # 여행 적합도 / 산책 위험도 임계값.
  # 확정된 수의학 기준이 아니라 현재의 판단이므로, 재빌드 없이 Vault 값만 고쳐
  # 조정할 수 있도록 전부 환경변수로 뺀다. 기본값은 application.yml 과 같다.
  INSIGHT_RAIN_PROBABILITY_PERCENT: ${INSIGHT_RAIN_PROBABILITY_PERCENT:-60}
  INSIGHT_HOT_TEMPERATURE: ${INSIGHT_HOT_TEMPERATURE:-28.0}
  INSIGHT_VERY_HOT_TEMPERATURE: ${INSIGHT_VERY_HOT_TEMPERATURE:-31.0}
  INSIGHT_COLD_TEMPERATURE: ${INSIGHT_COLD_TEMPERATURE:-5.0}
  INSIGHT_VERY_COLD_TEMPERATURE: ${INSIGHT_VERY_COLD_TEMPERATURE:-0.0}
  INSIGHT_STRONG_WIND_SPEED: ${INSIGHT_STRONG_WIND_SPEED:-9.0}
  INSIGHT_PAVEMENT_CAUTION_CELSIUS: ${INSIGHT_PAVEMENT_CAUTION_CELSIUS:-42.0}
  INSIGHT_PAVEMENT_DANGER_CELSIUS: ${INSIGHT_PAVEMENT_DANGER_CELSIUS:-52.0}
  INSIGHT_HEAT_INDEX_CAUTION_CELSIUS: ${INSIGHT_HEAT_INDEX_CAUTION_CELSIUS:-27.0}
  INSIGHT_HEAT_INDEX_DANGER_CELSIUS: ${INSIGHT_HEAT_INDEX_DANGER_CELSIUS:-32.0}
  INSIGHT_ALTERNATIVE_RADIUS_METERS: ${INSIGHT_ALTERNATIVE_RADIUS_METERS:-5000}
  INSIGHT_ALTERNATIVE_SIZE: ${INSIGHT_ALTERNATIVE_SIZE:-5}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  tour-service-dev:
    image: hondigagae-tour-service:latest
    container_name: hondigagae-tour-service-dev
    labels:
      observability.project: hondigagae
      observability.group: service
      observability.service: tour-service
      observability.env: dev
      observability.application: ${TOUR_SERVICE_APP_NAME}
      observability.deployment: hondigagae-tour-service-dev
    build:
      context: .
      dockerfile: tour-service.Dockerfile
    ports:
      - "${TOUR_SERVICE_PORT_DEV}:${TOUR_SERVICE_PORT}" # host:container
    environment:
      <<: *tour_service_environment
    # 컨테이너 메모리 상한. JVM heap 은 Dockerfile 의 MaxRAMPercentage 가 이 값을 기준으로 산정한다.
    deploy:
      resources:
        limits:
          memory: ${TOUR_SERVICE_MEM_LIMIT_DEV:-512m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

  tour-service-prod:
    image: hondigagae-tour-service:latest
    container_name: hondigagae-tour-service-prod
    labels:
      observability.project: hondigagae
      observability.group: service
      observability.service: tour-service
      observability.env: prod
      observability.application: ${TOUR_SERVICE_APP_NAME}
      observability.deployment: hondigagae-tour-service-prod
    build:
      context: .
      dockerfile: tour-service.Dockerfile
    ports:
      - "${TOUR_SERVICE_PORT_PROD}:${TOUR_SERVICE_PORT}" # host:container
    environment:
      <<: *tour_service_environment
    deploy:
      resources:
        limits:
          memory: ${TOUR_SERVICE_MEM_LIMIT_PROD:-768m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    external: true
