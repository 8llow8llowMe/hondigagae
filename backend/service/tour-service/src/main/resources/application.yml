spring:
  application:
    name: ${SPRING_APPLICATION_NAME:tour-service}
  config:
    import: optional:classpath:observability-common.yml
  profiles:
    active: local

infra:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:hondigagae}

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          # 사용자 요청 문제(좌표 없음 등)로 생긴 도메인 예외가 서킷을 열지 않게 한다.
          - com.hondigagae.domainlayer.insight.application.exception.InsightException
    instances:
      # 기상청 단기예보. 제공처 단위로 인스턴스를 분리한다 (coding-conventions §10).
      kma:
        base-config: default
        # 사용자 요청 경로에서 부르는 호출이라 느린 응답을 빨리 실패로 본다.
        slow-call-duration-threshold: 2s

# 기상청 예보. serviceKey 는 공공데이터포털 "디코딩(원문)" 키를 그대로 넣는다 -
# 인코딩은 어댑터가 한다. 관광공사(B551011) 키와 같은 키를 쓸 수 있음이 실호출로 확인되어 있다.
kma-api:
  base-url: ${KMA_API_BASE_URL:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
  # 중기예보. 단기예보가 닿지 않는 D+3 ~ D+10 을 덮는다. 키는 같은 것을 쓴다.
  mid-term-base-url: ${KMA_MID_TERM_BASE_URL:https://apis.data.go.kr/1360000/MidFcstInfoService}
  service-key: ${KMA_API_SERVICE_KEY:}
  publish-delay-minutes: ${KMA_PUBLISH_DELAY_MINUTES:10}
  # 중기예보는 1일 2회(06, 18시) 발표라 회차 간격이 12시간이다.
  mid-term-publish-delay-minutes: ${KMA_MID_TERM_PUBLISH_DELAY_MINUTES:20}
  num-of-rows: ${KMA_NUM_OF_ROWS:1000}
  stale-cache-seconds: ${KMA_STALE_CACHE_SECONDS:21600}
  mid-term-stale-cache-seconds: ${KMA_MID_TERM_STALE_CACHE_SECONDS:129600}

# 여행 적합도 / 산책 위험도 임계값.
# 확정된 수의학 기준이 아니라 현재의 판단이므로 배포 없이 조정할 수 있게 프로퍼티로 둔다.
insight:
  rain-probability-percent: ${INSIGHT_RAIN_PROBABILITY_PERCENT:60}
  hot-temperature: ${INSIGHT_HOT_TEMPERATURE:28.0}
  very-hot-temperature: ${INSIGHT_VERY_HOT_TEMPERATURE:31.0}
  cold-temperature: ${INSIGHT_COLD_TEMPERATURE:5.0}
  very-cold-temperature: ${INSIGHT_VERY_COLD_TEMPERATURE:0.0}
  strong-wind-speed: ${INSIGHT_STRONG_WIND_SPEED:9.0}
  pavement-caution-celsius: ${INSIGHT_PAVEMENT_CAUTION_CELSIUS:42.0}
  pavement-danger-celsius: ${INSIGHT_PAVEMENT_DANGER_CELSIUS:52.0}
  heat-index-caution-celsius: ${INSIGHT_HEAT_INDEX_CAUTION_CELSIUS:27.0}
  heat-index-danger-celsius: ${INSIGHT_HEAT_INDEX_DANGER_CELSIUS:32.0}
  alternative-radius-meters: ${INSIGHT_ALTERNATIVE_RADIUS_METERS:5000}
  alternative-size: ${INSIGHT_ALTERNATIVE_SIZE:5}
