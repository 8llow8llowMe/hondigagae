server:
  port: 8082
  shutdown: graceful

spring:
  cloud:
    config:
      enabled: false  # 로컬에서만 Config Server 비활성화

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hondigagae?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true
    username: ${DB_USERNAME:hondigagae}
    password: ${DB_PASSWORD:hondigagae123!}

  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        show_sql: true
        jdbc:
          batch_size: 100
        default_batch_fetch_size: 100

# log 관리
logging:
  level:
    org.hibernate.type.descriptor.sql: trace
    org.hibernate.SQL: debug

# snowflake
snowflake:
  datacenter-id: 1
  worker-id: 2

# Redis
infra:
  redis:
    mode: standalone
    host: localhost
    port: 6379
    password:
    key-prefix: ${REDIS_KEY_PREFIX:hondigagae:local}

# 장소 추천 예열(#1388)은 로컬에서 끈다 — 하루 8번 기상청 쿼터를 개발자 노트북이 태우지 않게 한다.
# 확인이 필요하면 INSIGHT_RECOMMENDATION_PREWARM_ENABLED=true 로 켠다.
insight:
  recommendation:
    prewarm:
      enabled: ${INSIGHT_RECOMMENDATION_PREWARM_ENABLED:false}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
