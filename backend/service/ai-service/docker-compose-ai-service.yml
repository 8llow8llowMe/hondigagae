# 혼디가개 ai-service 배포 정의.
#
# 배치:
#   dev  -> main-server (192.168.0.11), 호스트 포트 7085  (혼디가개 dev 는 7xxx 대역)
#   prod -> backend-1   (192.168.0.13), 호스트 포트 5085  (혼디가개 prod 는 5xxx 대역)
#
#   BossPickSeoul 이 dev 6xxx / prod 9xxx 를 이미 점유하고 있어 같은 호스트에 올리려면
#   대역을 달리해야 한다. (Infra README §4 배치 원칙 5번)
#   storage(192.168.0.12)에는 올리지 않는다 — 총 1.9GB / swap 0 에 nginx 가 함께 있어
#   OOM 이 나면 전 도메인의 인그레스가 같이 죽는다.
#
# 컨테이너 안에서 앱이 듣는 포트는 dev/prod 가 같다(8085). 호스트 포트만 다르다.
# 서비스 간 호출과 Eureka 등록은 같은 호스트의 8llow8llowme-net 브리지 안에서 컨테이너명으로 이뤄지므로,
# SERVICE_DISCOVERY_HOSTNAME 에는 사설 IP 가 아니라 discovery **컨테이너명**을 넣는다.

x-ai-service-environment: &ai_service_environment
  TIME_ZONE: ${TIME_ZONE}
  # prod 로 띄우면서 이 값이 dev 로 남아 있으면 ddl-auto:update 로
  # 운영 스키마가 배포마다 자동 변경된다. 환경별 Vault secret 에서 반드시 갈라 둔다.
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  SPRING_APPLICATION_NAME: ${AI_SERVICE_APP_NAME}
  AI_SERVICE_PORT: ${AI_SERVICE_PORT}
  # 같은 호스트 같은 브리지 안이라 컨테이너명으로 해석된다.
  # 예) dev = hondigagae-service-discovery-dev / prod = hondigagae-service-discovery-prod
  SERVICE_DISCOVERY_HOSTNAME: ${SERVICE_DISCOVERY_HOSTNAME}
  # 컨테이너 내부 포트(8761)다. 호스트 포트(7761/5761)가 아니다.
  SERVICE_DISCOVERY_PORT: ${SERVICE_DISCOVERY_PORT}
  REDIS_MODE: ${REDIS_MODE}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  # sentinel 모드에서만 쓴다. standalone 이면 비워 둔다.
  # 노드는 host:port 콤마 구분. sentinel 인데 비어 있으면 RedisConfigurer 가 기동 시점에
  # 어떤 env 를 넣어야 하는지 적어 실패시킨다 — compose 가 넘기지 않으면 그 메시지가 나온다.
  REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-}
  REDIS_SENTINEL_NODES: ${REDIS_SENTINEL_NODES:-}
  # BossPickSeoul 과 같은 Redis 를 공유하므로 prefix 로 키 공간을 가른다.
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
  # Resource Server 검증 키. 프로퍼티 prefix 가 app.security.jwt.resource.access-key 라
  # 이름이 auth-service 발급 쪽(jwt.access-key)과 다르지만 값은 같아야 한다.
  # 다르면 컴파일도 기동도 되다가 첫 인증 요청에서 jwtDecoder NPE 로 죽는다.
  JWT_ACCESS_KEY: ${JWT_ACCESS_KEY}
  # 내부 호출 대상(lb://).
  TOUR_SERVICE_APP_NAME: ${TOUR_SERVICE_APP_NAME}
  # ai-service 는 일정을 소유하지 않는다. 생성 결과는 plan-service 에 넘긴다.
  PLAN_SERVICE_APP_NAME: ${PLAN_SERVICE_APP_NAME}
  INTERNAL_CLIENT_CONNECT_TIMEOUT_MS: ${INTERNAL_CLIENT_CONNECT_TIMEOUT_MS:-2000}
  INTERNAL_CLIENT_READ_TIMEOUT_MS: ${INTERNAL_CLIENT_READ_TIMEOUT_MS:-5000}
  # 작업 상태 Redis 보관 기간.
  AI_PLAN_JOB_TTL_SECONDS: ${AI_PLAN_JOB_TTL_SECONDS:-86400}
  AI_PLAN_JOB_PENDING_TIMEOUT_SECONDS: ${AI_PLAN_JOB_PENDING_TIMEOUT_SECONDS:-30}
  AI_PLAN_JOB_RUNNING_TIMEOUT_SECONDS: ${AI_PLAN_JOB_RUNNING_TIMEOUT_SECONDS:-300}
  # LLM (Spring AI / Ollama). 기본값은 yml 과 같은 enabled=false 라 넘기지 않으면 Vault 에
  # AI_LLM_ENABLED=true 를 넣어도 컨테이너는 Stub 으로 뜬다. 그래서 전부 전달한다.
  # 공유 인프라의 Ollama 는 다른 호스트(ollama-01)라 컨테이너명이 아니라 사설 IP 로 접속한다.
  AI_LLM_ENABLED: ${AI_LLM_ENABLED:-false}
  AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-OLLAMA}
  AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-http://localhost:11434}
  AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
  AI_LLM_MODEL: ${AI_LLM_MODEL:-qwen2.5:7b-instruct}
  AI_LLM_TIMEOUT_MS: ${AI_LLM_TIMEOUT_MS:-120000}
  AI_LLM_MAX_TOKENS: ${AI_LLM_MAX_TOKENS:-4000}
  AI_LLM_TEMPERATURE: ${AI_LLM_TEMPERATURE:-0.2}
  AI_LLM_REASONING_EFFORT: ${AI_LLM_REASONING_EFFORT:-low}
  AI_LLM_PLACE_CANDIDATE_SIZE: ${AI_LLM_PLACE_CANDIDATE_SIZE:-50}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  ai-service-dev:
    image: hondigagae-ai-service:latest
    container_name: hondigagae-ai-service-dev
    labels:
      observability.project: hondigagae
      observability.group: service
      observability.service: ai-service
      observability.env: dev
      observability.application: ${AI_SERVICE_APP_NAME}
      observability.deployment: hondigagae-ai-service-dev
    build:
      context: .
      dockerfile: ai-service.Dockerfile
    ports:
      - "${AI_SERVICE_PORT_DEV}:${AI_SERVICE_PORT}" # host:container
    environment:
      <<: *ai_service_environment
    # 컨테이너 메모리 상한. JVM heap 은 Dockerfile 의 MaxRAMPercentage 가 이 값을 기준으로 산정한다.
    deploy:
      resources:
        limits:
          memory: ${AI_SERVICE_MEM_LIMIT_DEV:-512m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

  ai-service-prod:
    image: hondigagae-ai-service:latest
    container_name: hondigagae-ai-service-prod
    labels:
      observability.project: hondigagae
      observability.group: service
      observability.service: ai-service
      observability.env: prod
      observability.application: ${AI_SERVICE_APP_NAME}
      observability.deployment: hondigagae-ai-service-prod
    build:
      context: .
      dockerfile: ai-service.Dockerfile
    ports:
      - "${AI_SERVICE_PORT_PROD}:${AI_SERVICE_PORT}" # host:container
    environment:
      <<: *ai_service_environment
    deploy:
      resources:
        limits:
          memory: ${AI_SERVICE_MEM_LIMIT_PROD:-768m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    external: true
