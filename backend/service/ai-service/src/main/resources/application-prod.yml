# ============================================================================
# prod 프로파일
#
# dev 와 같은 구조를 유지하고, 운영에서 위험한 항목만 다르게 둔다.
#   - Swagger: AiServiceSwaggerConfig 가 @Profile("!prod") 라 빈이 등록되지 않는다.
#
# 값은 dev 와 동일한 env 키를 쓰되 Vault prod secret(kv/hondigagae/backend/prod/env)에서 주입된다.
# ============================================================================
server:
  port: ${AI_SERVICE_PORT}
  shutdown: graceful

spring:
  cloud:
    config:
      enabled: false

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    serviceUrl:
      defaultZone: http://${SERVICE_DISCOVERY_HOSTNAME}:${SERVICE_DISCOVERY_PORT}/eureka/

infra:
  redis:
    mode: ${REDIS_MODE}
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    key-prefix: ${REDIS_KEY_PREFIX}

# Resource Server 검증 키. auth-service 가 발급에 쓰는 JWT_ACCESS_KEY 와 같은 값을 주입한다.
app:
  security:
    jwt:
      resource:
        access-key: ${JWT_ACCESS_KEY}
