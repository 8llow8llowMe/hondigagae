spring:
  application:
    name: ${SPRING_APPLICATION_NAME:batch-service}
  config:
    import: optional:classpath:observability-common.yml
  profiles:
    active: local
  batch:
    job:
      # 기동 시 잡 자동 실행 금지 — 잡 이름을 지정한 수동 실행만 허용한다.
      # 예) --spring.batch.job.enabled=true --spring.batch.job.name=placeImportJob areaCode=39
      enabled: false

tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011}
  # 공공데이터포털 "디코딩(원문)" 키. 절대 커밋하지 않는다 — env 또는 Jasypt ENC()로만 주입.
  service-key: ${TOUR_API_SERVICE_KEY:}
  mobile-os: ETC
  mobile-app: hondigagae

# 공공 API 서킷 (coding-conventions §10). 제공처 단위로 인스턴스를 분리한다.
#
# 배치라 사용자 응답은 없지만 서킷이 필요하다. 원천이 죽었을 때 수천 건을 타임아웃까지
# 기다리며 계속 두드리면 쿼터만 태우고 잡 시간이 몇 시간씩 늘어진다. 빨리 포기하는 것이 값어치다.
#
# ignore-exceptions 를 두지 않는 이유: 어댑터가 서킷으로 감싸는 것은 전송 호출뿐이고,
# 응답 해석 실패(규격 불일치)나 키 누락은 서킷 밖에서 도메인 예외로 변환된다.
# 즉 서킷이 집계하는 것은 이미 전송 실패(5xx·타임아웃)뿐이다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      # 한국관광공사 TourAPI(B551011). 장소 목록·상세를 페이지 단위로 반복 호출한다.
      tourapi:
        base-config: default
      # 관광공사 집중률 예측(TATS). 지역 x 날짜로 호출 수가 많다.
      tats:
        base-config: default
      # VWorld 지오코더. 주소 건당 호출이라 이 중 호출량이 가장 많다.
      # 실패해도 좌표 없이 적재하고 넘어가므로 창을 넓게 잡아 잘 안 열리게 둔다.
      vworld:
        base-config: default
        sliding-window-size: 50
        minimum-number-of-calls: 20
      # 식약처 파일 서버. 잡당 한 번뿐이라 표본이 모이지 않는다.
      # 최소 호출 수를 낮춰 연속 실패가 바로 잡히게 한다.
      mfds:
        base-config: default
        sliding-window-size: 5
        minimum-number-of-calls: 3
        # 수 MB xlsx 를 받는 경로라 느린 호출 기준을 완화한다.
        slow-call-duration-threshold: 30s

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN

# 문화정보원 반려동물 동반 가능 문화시설 CSV.
# 공공데이터포털 파일데이터라 활용신청도 인증키도 필요 없다 (data.go.kr/data/15111389).
culture-facility:
  file-path: ${CULTURE_FACILITY_CSV_PATH:data/pet_culture.csv}

# 식약처 반려동물 동반출입 음식점 등록 현황(xlsx).
# 인증키가 없다. file-path 에 파일이 있으면 그 파일을, 없으면 원천에서 내려받는다.
mfds:
  pet-restaurant:
    base-url: ${MFDS_BASE_URL:https://www.foodsafetykorea.go.kr}
    download-path: ${MFDS_PET_RESTAURANT_PATH:/portal/petKorea/downloadExcel.do}
    file-path: ${MFDS_PET_RESTAURANT_FILE_PATH:}
    # connect 타임아웃은 openApiWebClient 가 공통으로 잡는다 (WebClientConfig).
    read-timeout-ms: ${MFDS_READ_TIMEOUT_MS:30000}

# VWorld 지오코더. 식약처 원천이 주소만 주므로 좌표를 여기서 채운다 (일 40,000건 무료).
vworld:
  base-url: ${VWORLD_BASE_URL:https://api.vworld.kr}
  api-key: ${VWORLD_API_KEY:}
  # connect 타임아웃은 openApiWebClient 가 공통으로 잡는다 (WebClientConfig).
  read-timeout-ms: ${VWORLD_READ_TIMEOUT_MS:10000}
