spring:
  application:
    name: ${SPRING_APPLICATION_NAME:batch-service}
  config:
    import: optional:classpath:observability-common.yml
  profiles:
    active: local
  batch:
    job:
      # 기동 시 잡 자동 실행 금지 — 잡 이름을 지정한 수동 실행만 허용한다.
      # 예) --spring.batch.job.enabled=true --spring.batch.job.name=placeImportJob areaCode=39
      enabled: false
  # 적재 스냅샷 테이블(import_source_snapshot, #379). Spring Batch 메타 테이블과 같은 정책이다 —
  # local·dev·test 는 애플리케이션이 만들고(always), prod 는 사람이 런북으로 적용한다(never).
  # 기본을 never 로 두는 이유: 새 프로파일이 생겼을 때 조용히 DDL 을 도는 쪽이 더 위험하다.
  sql:
    init:
      mode: never
      schema-locations: classpath:db/import-source-snapshot-mysql.sql
  # 프로세스 안 Quartz (#378). 주기 실행 트리거는 QuartzScheduleConfig 가 코드로 들고 있다.
  quartz:
    # 인스턴스가 하나고 트리거 정의가 코드에 있어 영속할 상태가 없다.
    # JDBC 스토어를 쓰면 tour 스키마에 QRTZ_* 테이블만 늘어난다.
    job-store-type: memory
    # 여기서는 항상 끈다. 켜는 것은 QuartzScheduleConfig 의 SchedulerFactoryBeanCustomizer 로,
    # 스케줄 조건이 참인 컨텍스트에서만 auto-startup 을 true 로 되돌린다.
    # ${batch.schedule.enabled:false} 를 그대로 꽂으면 env 가 빈 문자열일 때 불리언 바인딩이 깨진다.
    auto-startup: false
    properties:
      org.quartz.scheduler.instanceName: batch-service-scheduler
      # 스레드 1개 = 파이프라인과 혼잡도가 절대 동시에 돌지 않는다.
      # 둘은 JobKey 가 다르므로 @DisallowConcurrentExecution 만으로는 막히지 않는다.
      org.quartz.threadPool.threadCount: "1"
      # Quartz 스레드는 데몬이다. SchedulerFactoryBean 은 auto-startup 과 무관하게 스케줄러를
      # 만들면서 스레드풀·스케줄러 스레드를 띄우므로, non-daemon 이면
      # `--spring.main.web-application-type=none` 으로 띄운 수동 실행 JVM 이 잡을 끝내고도 죽지
      # 않고 컨테이너 안에 좀비 JVM 으로 남는다.
      # 메모리 잡 스토어 + 단일 인스턴스라 갑작스러운 종료로 잃을 상태가 없어 부작용도 없다.
      org.quartz.threadPool.makeThreadsDaemons: "true"
      org.quartz.scheduler.makeSchedulerThreadDaemon: "true"

# 주기 실행 스케줄 (#378).
#
# enabled 는 로컬·CI 에서 꺼진 채로 둔다 — 개발자 노트북이 새벽 3시에 TourAPI 쿼터를 태우거나
# 테스트 컨텍스트가 실제 적재를 시작하면 안 된다. dev 프로파일만 기본 true 다.
#
# 스위치는 조건이 둘이다. batch.schedule.enabled 가 true 이고 동시에
# spring.batch.job.enabled 가 false 여야 트리거가 등록된다 — 후자가 true 인 JVM 은
# `docker exec` 로 잡 하나만 돌리고 끝나는 수동 실행이라 스케줄을 얹으면 안 된다.
# 판정은 SpEL 이 아니라 @ConditionalOnProperty 조합(ScheduleEnabledCondition)이다.
# 정확히 "true" 가 아닌 값(빈 문자열·yes·1)은 전부 꺼짐으로 본다 — 기동을 막지 않는다.
batch:
  schedule:
    enabled: ${BATCH_SCHEDULE_ENABLED:false}
    # cron 이 뜻하는 시각은 배포 환경(-Duser.timezone)이 아니라 원천의 갱신 주기에서 나온다.
    time-zone: ${BATCH_SCHEDULE_TIME_ZONE:Asia/Seoul}
    # 월요일 03:00 KST. Quartz cron 은 6~7 필드다(초가 맨 앞).
    place-pipeline-cron: ${BATCH_SCHEDULE_PLACE_PIPELINE_CRON:0 0 3 ? * MON}
    # 매일 06:00 KST. 30일 rolling 원천이라 일 1회.
    congestion-cron: ${BATCH_SCHEDULE_CONGESTION_CRON:0 0 6 * * ?}
    # 이 시간을 넘긴 STARTED 실행은 죽은 JVM 의 잔재로 보고 무시한다.
    stale-running-after: ${BATCH_SCHEDULE_STALE_RUNNING_AFTER:6h}

tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011}
  # 공공데이터포털 "디코딩(원문)" 키. 절대 커밋하지 않는다 — env 또는 Jasypt ENC()로만 주입.
  service-key: ${TOUR_API_SERVICE_KEY:}
  mobile-os: ETC
  mobile-app: hondigagae

# 공공 API 서킷 (coding-conventions §10). 제공처 단위로 인스턴스를 분리한다.
#
# 배치라 사용자 응답은 없지만 서킷이 필요하다. 원천이 죽었을 때 수천 건을 타임아웃까지
# 기다리며 계속 두드리면 쿼터만 태우고 잡 시간이 몇 시간씩 늘어진다. 빨리 포기하는 것이 값어치다.
#
# ignore-exceptions 를 두지 않는 이유: 어댑터가 서킷으로 감싸는 것은 전송 호출뿐이고,
# 응답 해석 실패(규격 불일치)나 키 누락은 서킷 밖에서 도메인 예외로 변환된다.
# 즉 서킷이 집계하는 것은 이미 전송 실패(5xx·타임아웃)뿐이다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      # 한국관광공사 TourAPI(B551011). 장소 목록·상세를 페이지 단위로 반복 호출한다.
      tourapi:
        base-config: default
      # 관광공사 집중률 예측(TATS). 지역 x 날짜로 호출 수가 많다.
      tats:
        base-config: default
      # VWorld 지오코더. 주소 건당 호출이라 이 중 호출량이 가장 많다.
      # 실패해도 좌표 없이 적재하고 넘어가므로 창을 넓게 잡아 잘 안 열리게 둔다.
      vworld:
        base-config: default
        sliding-window-size: 50
        minimum-number-of-calls: 20
      # 식약처 파일 서버. 잡당 한 번뿐이라 표본이 모이지 않는다.
      # 최소 호출 수를 낮춰 연속 실패가 바로 잡히게 한다.
      mfds:
        base-config: default
        sliding-window-size: 5
        minimum-number-of-calls: 3
        # 수 MB xlsx 를 받는 경로라 느린 호출 기준을 완화한다.
        slow-call-duration-threshold: 30s
      # 공공데이터포털 파일 서버(#379). 상세 페이지 + 30MB CSV 다운로드 둘을 함께 센다.
      # 잡당 두 번뿐이라 mfds 와 같은 이유로 창을 좁게 잡는다.
      datagokr:
        base-config: default
        sliding-window-size: 5
        minimum-number-of-calls: 3
        # 30MB 스트리밍이 정상적으로 수십 초 걸린다. 10s 기준이면 성공한 호출이 느린 호출로 집계돼
        # 서킷이 열리고, 그러면 매번 로컬 우회로 물러나 자동 갱신이 사실상 꺼진다.
        slow-call-duration-threshold: 60s

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN

# 문화정보원 반려동물 동반 가능 문화시설 CSV.
# 공공데이터포털 파일데이터라 활용신청도 인증키도 필요 없다 (data.go.kr/data/15111389).
#
# 배치가 포털에서 직접 내려받는 것이 기본이다 (#379). 상세 페이지의 JSON-LD 에 파일 주소가 있고,
# atchFileId 와 바이트 수가 직전 적재와 같으면 30MB 를 받지도 적재하지도 않는다.
culture-facility:
  # 포털 실패 시 우회용 파일. 컨테이너에서는 /app/data 가 읽기 전용이라 여기에 쓸 수 없다.
  file-path: ${CULTURE_FACILITY_CSV_PATH:data/pet_culture.csv}
  # 끄면 종전처럼 위 파일만 읽는다. 빈 문자열(compose 의 ${VAR:-})은 래퍼 타입 Boolean 에 null 로
  # 떨어지고 CultureFacilityProperties 가 기본값 true 로 접는다(CultureFacilityPropertiesTest).
  # compose 쪽에도 :-true 를 두는 것은 "켠 것이 의도"임을 배포 파일에서도 읽히게 하려는 것이다.
  download-enabled: ${CULTURE_FACILITY_DOWNLOAD_ENABLED:true}
  base-url: ${CULTURE_FACILITY_BASE_URL:https://www.data.go.kr}
  dataset-id: ${CULTURE_FACILITY_DATASET_ID:15111389}
  # 비면 JVM 임시 디렉터리(java.io.tmpdir). 30MB 를 쓸 수 있는 곳이어야 한다.
  download-dir: ${CULTURE_FACILITY_DOWNLOAD_DIR:}
  # 단계(페이지 읽기·헤더 수신·본문 전송)별 상한이라 실질 상한은 이 값의 배수다.
  # connect 타임아웃은 openApiWebClient 가 공통으로 잡는다 (WebClientConfig).
  read-timeout-ms: ${CULTURE_FACILITY_READ_TIMEOUT_MS:120000}
  # 이보다 작으면 CSV 가 아니라 오류·점검 페이지로 본다 (실측 원본은 약 30MB).
  min-content-length: ${CULTURE_FACILITY_MIN_CONTENT_LENGTH:1048576}

# 제주올레 코스현황 CSV.
# 공공데이터포털 파일데이터라 활용신청도 인증키도 필요 없다 (data.go.kr/data/15043496).
# 원본이 CP949 여도 어댑터가 판별해 읽는다.
olle-course:
  file-path: ${OLLE_COURSE_CSV_PATH:data/olle_course.csv}

# 식약처 반려동물 동반출입 음식점 등록 현황(xlsx).
# 인증키가 없다. file-path 에 파일이 있으면 그 파일을, 없으면 원천에서 내려받는다.
mfds:
  pet-restaurant:
    base-url: ${MFDS_BASE_URL:https://www.foodsafetykorea.go.kr}
    download-path: ${MFDS_PET_RESTAURANT_PATH:/portal/petKorea/downloadExcel.do}
    file-path: ${MFDS_PET_RESTAURANT_FILE_PATH:}
    # connect 타임아웃은 openApiWebClient 가 공통으로 잡는다 (WebClientConfig).
    read-timeout-ms: ${MFDS_READ_TIMEOUT_MS:30000}

# VWorld 지오코더. 식약처 원천이 주소만 주므로 좌표를 여기서 채운다 (일 40,000건 무료).
vworld:
  base-url: ${VWORLD_BASE_URL:https://api.vworld.kr}
  api-key: ${VWORLD_API_KEY:}
  # connect 타임아웃은 openApiWebClient 가 공통으로 잡는다 (WebClientConfig).
  read-timeout-ms: ${VWORLD_READ_TIMEOUT_MS:10000}
