server:
  port: ${BATCH_SERVICE_PORT}
  shutdown: graceful

spring:
  cloud:
    config:
      enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BATCH_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  batch:
    jdbc:
      initialize-schema: always
  # import_source_snapshot DDL 도 같은 정책으로 애플리케이션이 만든다 (#379).
  sql:
    init:
      mode: always

tour-api:
  service-key: ${TOUR_API_SERVICE_KEY}

# dev 는 프로세스 안 Quartz 를 켠다 (#378) — 장소 파이프라인 주 1회(월 03:00 KST),
# 올레 주 1회(월 05:00 KST), 혼잡도 일 1회(06:00 KST). 컨테이너가 restart: unless-stopped 로 상시 떠 있어
# 스케줄러가 살아 있을 수 있다. 끄려면 compose 에 BATCH_SCHEDULE_ENABLED=false 를 준다.
batch:
  schedule:
    enabled: ${BATCH_SCHEDULE_ENABLED:true}

eureka:
  instance:
    # Docker 컨테이너 환경: 컨테이너 IP로 등록해야 게이트웨이 lb:// 라우팅이
    # 컨테이너 hostname(컨테이너 ID) DNS 해석 실패 없이 연결된다.
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    serviceUrl:
      defaultZone: http://${SERVICE_DISCOVERY_HOSTNAME}:${SERVICE_DISCOVERY_PORT}/eureka/
