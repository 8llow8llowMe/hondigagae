# ============================================================================
# prod 프로파일
#
# dev 와 같은 구조를 유지하고, 운영에서 위험한 항목만 다르게 둔다.
#   - batch.jdbc.initialize-schema: never — 운영 스키마(BATCH_* 메타 테이블 포함)는
#     애플리케이션이 만들지 않는다. 스키마는 사람이 런북으로 적용한다.
#
# 값은 dev 와 동일한 env 키를 쓰되 Vault prod secret(kv/hondigagae/backend/prod/env)에서 주입된다.
# ============================================================================
server:
  port: ${BATCH_SERVICE_PORT}
  shutdown: graceful

spring:
  cloud:
    config:
      enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BATCH_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  batch:
    jdbc:
      initialize-schema: never

tour-api:
  service-key: ${TOUR_API_SERVICE_KEY}

# prod 에서 스케줄을 켤지는 아직 미결이다. 운영 데이터에 자동 delisting 이 걸리는 흐름이라
# dev 에서 몇 주기를 관찰한 뒤 정한다. 켜려면 BATCH_SCHEDULE_ENABLED=true 만 주면 된다.
batch:
  schedule:
    enabled: ${BATCH_SCHEDULE_ENABLED:false}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    serviceUrl:
      defaultZone: http://${SERVICE_DISCOVERY_HOSTNAME}:${SERVICE_DISCOVERY_PORT}/eureka/
