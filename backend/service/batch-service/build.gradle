dependencies {
    implementation project(':core:common-core')
    // 영업시간 spec 이 배치(쓰기)와 tour(읽기)를 가로지르는 계약이라 공용 모듈을 쓴다
    implementation project(':core:shared-travel')

    implementation 'org.springframework.boot:spring-boot-starter-batch'
    // 주기 실행을 배포 호스트 cron 이 아니라 이 프로세스 안에 둔다 (#378) — 컨테이너가 상시 기동이라
    // 스케줄이 배포 단위와 함께 움직이고, docker exec 로 두 번째 JVM 을 띄우지 않아도 된다.
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // TourAPI 등 공공 데이터 수집용 WebClient
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    runtimeOnly 'com.mysql:mysql-connector-j'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    // 공공 API 호출에 서킷을 건다 (coding-conventions §10). 배치라 사용자 응답은 없지만,
    // 원천이 죽었을 때 수천 건을 계속 두드리며 쿼터만 태우는 것을 막는다.
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // 식약처 반려동물 동반출입 음식점 현황이 xlsx 로만 제공된다.
    implementation 'org.apache.poi:poi-ooxml:5.4.1'

    // 컨텍스트 로딩 게이트(BatchServiceApplicationTests) 용 인메모리 DB. 잡 배선은 컴파일로 검증되지 않는다.
    testRuntimeOnly 'com.h2database:h2'
}
