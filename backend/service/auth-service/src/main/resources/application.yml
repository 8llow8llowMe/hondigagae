spring:
  application:
    name: ${SPRING_APPLICATION_NAME:auth-service}
  config:
    import: optional:classpath:observability-common.yml
  profiles:
    active: local

infra:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:hondigagae}

logging:
  level:
    # Eureka 클라이언트가 주기적으로 Eureka 서버 엔드포인트를 확인할 때 출력하는 반복 로그를 줄이기 위한 설정
    com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver: WARN

# 카카오 OAuth 호출 서킷브레이커.
# 4xx(인가코드 만료·재사용 등 사용자 조작 문제)는 OAuthApiCallSupport가 서킷 안에서
# AuthException으로 변환하므로, ignore 처리해 provider 장애로 집계하지 않는다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.hondigagae.domainlayer.auth.application.exception.AuthException
    instances:
      kakao:
        base-config: default
