<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mail(preheader=|${providerName} 로그인으로 가입된 계정입니다.|, heading='혼디가개 비밀번호 재설정 안내', content=~{::content})}">
<body>
<th:block th:fragment="content">
  <p class="m-text" style="margin:0 0 12px 0; font-size:15px; line-height:24px; color:#15181D;">이 계정은 <b th:text="|${providerName} 로그인|">소셜 로그인</b>으로 가입되어 별도의 비밀번호가 없습니다.</p>
  <p class="m-text" style="margin:0 0 12px 0; font-size:15px; line-height:24px; color:#15181D;">로그인 화면에서 <span th:text="|${providerName} 로그인|">소셜 로그인</span>을 이용해주세요.</p>
  <p class="m-muted" style="margin:20px 0 0 0; font-size:13px; line-height:20px; color:#596069;">본인이 요청하지 않았다면 이 메일을 무시해주세요.</p>
</th:block>
</body>
</html>
