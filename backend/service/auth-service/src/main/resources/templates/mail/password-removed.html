<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mail(preheader=|회원님의 계정이 ${providerName} 전용 계정으로 전환되었습니다.|, heading='혼디가개 소셜 전용 계정 전환 안내', content=~{::content})}">
<body>
<th:block th:fragment="content">
  <p class="m-text" style="margin:0 0 12px 0; font-size:15px; line-height:24px; color:#15181D;">회원님의 계정이 <b th:text="|${providerName} 전용 계정|">소셜 전용 계정</b>으로 전환되어 비밀번호가 제거되었습니다.</p>
  <p class="m-text" style="margin:0 0 12px 0; font-size:15px; line-height:24px; color:#15181D;">
    이제 <span th:text="|${providerName} 로그인|">소셜 로그인</span>으로만 이용할 수 있으며, 보안을 위해 모든 기기에서 로그아웃되었습니다.</p>
  <p class="m-warn" style="margin:20px 0 0 0; font-size:13px; line-height:20px; font-weight:700; color:#B91C1C;">
    본인이 한 것이 아니라면 즉시 <span th:text="|${providerName} 계정|">소셜 계정</span>의 보안 상태를 확인해주세요.</p>
</th:block>
</body>
</html>
