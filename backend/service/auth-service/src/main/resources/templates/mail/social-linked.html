<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mail(preheader=|회원님의 계정에 ${providerName} 로그인이 연결되었습니다.|, heading='혼디가개 소셜 로그인 연결 안내', content=~{::content})}">
<body>
<th:block th:fragment="content">
  <p class="m-text" style="margin:0 0 12px 0; font-size:15px; line-height:24px; color:#15181D;">회원님의 계정에 <b th:text="|${providerName} 로그인|">소셜 로그인</b>이 연결되었습니다.</p>
  <p class="m-text" style="margin:0 0 12px 0; font-size:15px; line-height:24px; color:#15181D;">
    이제 기존 이메일 로그인과 <span th:text="|${providerName} 로그인|">소셜 로그인</span> 모두 사용할 수 있습니다.</p>
  <p class="m-warn" style="margin:20px 0 0 0; font-size:13px; line-height:20px; font-weight:700; color:#B91C1C;">본인이 한 것이 아니라면 즉시 비밀번호를 변경해주세요.</p>
</th:block>
</body>
</html>
