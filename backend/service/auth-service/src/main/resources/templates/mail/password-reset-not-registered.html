<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mail(preheader='이 이메일로 가입된 계정이 없습니다.', heading='혼디가개 비밀번호 재설정 안내', content=~{::content})}">
<body>
<th:block th:fragment="content">
  <p class="m-text" style="margin:0 0 12px 0; font-size:15px; line-height:24px; color:#15181D;">이 이메일로 가입된 계정이 없습니다.</p>
  <p class="m-text" style="margin:0 0 12px 0; font-size:15px; line-height:24px; color:#15181D;">이메일 주소를 다시 확인하시거나, 회원가입을 진행해주세요.</p>
  <p class="m-muted" style="margin:20px 0 0 0; font-size:13px; line-height:20px; color:#596069;">본인이 요청하지 않았다면 이 메일을 무시해주세요.</p>
</th:block>
</body>
</html>
