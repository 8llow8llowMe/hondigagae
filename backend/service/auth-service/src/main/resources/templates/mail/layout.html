<!DOCTYPE html>
<!--
  인증 메일 공통 레이아웃 (#1062). 각 메일은 mail(preheader, heading, content) 로 이 틀을 쓴다.
  메일 클라이언트 호환 규칙: table 레이아웃, 기본(라이트) 스타일은 전부 인라인, CSS 변수·flex·grid·SVG·웹폰트 금지,
  동적 값은 th:text 로만 출력한다 (th:utext 금지). 색은 frontend/DESIGN.md 토큰의 실제 값이다.
  <style> 은 다크 모드 덮어쓰기 전용이다 — 읽지 않는 클라이언트는 인라인 라이트 스타일로 그대로 보인다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="mail(preheader, heading, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title th:text="${heading}">혼디가개</title>
  <style>
    @media (prefers-color-scheme: dark) {
      .logo-light { display:none !important; }
      .logo-dark-wrap { display:block !important; max-height:none !important; overflow:visible !important; }
      .m-page { background-color:#202124 !important; }
      .m-card { background-color:#111418 !important; border-color:#3A3D42 !important; }
      .m-text { color:#F0F0F0 !important; }
      .m-muted { color:#B8BCC2 !important; }
      .m-code { background-color:#26282C !important; color:#F0F0F0 !important; }
      .m-warn { color:#F87171 !important; }
    }
    [data-ogsc] .logo-light { display:none !important; }
    [data-ogsc] .logo-dark-wrap { display:block !important; max-height:none !important; overflow:visible !important; }
    [data-ogsb] .m-page { background-color:#202124 !important; }
    [data-ogsb] .m-card { background-color:#111418 !important; }
    [data-ogsb] .m-code { background-color:#26282C !important; }
    [data-ogsc] .m-card { border-color:#3A3D42 !important; }
    [data-ogsc] .m-text { color:#F0F0F0 !important; }
    [data-ogsc] .m-muted { color:#B8BCC2 !important; }
    [data-ogsc] .m-code { color:#F0F0F0 !important; }
    [data-ogsc] .m-warn { color:#F87171 !important; }
  </style>
</head>
<body class="m-page" style="margin:0; padding:0; background-color:#F5F6F8; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
  <div style="display:none; max-height:0; max-width:0; overflow:hidden; opacity:0; mso-hide:all; font-size:1px; line-height:1px; color:#F5F6F8;"
       th:text="${preheader}">미리보기 문구</div>
  <table class="m-page" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F6F8;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px; width:100%;">
          <tr>
            <td align="left" style="padding:0 4px 16px 4px;">
              <!--/*
                워드마크는 라이브 텍스트로 그리지 않는다(브랜드 규칙) — 로크업 이미지만 쓴다. 633x144 원본을 1/3 로 표시한다.
                다크 이미지는 기본으로 숨겨 두고(인라인 display:none — <style> 을 버리는 클라이언트에서도 숨는다),
                prefers-color-scheme: dark / Outlook [data-ogsc] 에서만 라이트 이미지와 바꾼다. 로고 URL 을 쓰면 다크 이미지는 없다.
              */-->
              <img class="logo-light" th:src="${logoSrc}" alt="혼디가개" width="155" height="35"
                   style="display:block; border:0; outline:none; text-decoration:none; width:155px; height:35px;">
              <div class="logo-dark-wrap" th:if="${logoDarkSrc}" style="display:none; mso-hide:all; max-height:0; overflow:hidden;">
                <img th:src="${logoDarkSrc}" alt="혼디가개" width="155" height="35"
                     style="display:block; border:0; outline:none; text-decoration:none; width:155px; height:35px;">
              </div>
            </td>
          </tr>
          <tr>
            <td class="m-card" style="background-color:#FFFFFF; border:1px solid #E3E5EA; border-radius:12px; padding:32px 24px;
                       font-family:Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:#15181D;">
              <h1 class="m-text" style="margin:0 0 16px 0; font-size:20px; line-height:28px; font-weight:700; color:#15181D;" th:text="${heading}">제목</h1>
              <th:block th:replace="${content}"></th:block>
            </td>
          </tr>
          <tr>
            <td class="m-muted" style="padding:16px 4px 0 4px; font-family:Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
                       font-size:12px; line-height:18px; color:#878D96;">
              이 메일은 발신 전용입니다. 회신하셔도 답변드릴 수 없습니다.<br>
              © 혼디가개
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
