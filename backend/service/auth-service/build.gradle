dependencies {
    implementation project(':core:common-core')
    implementation project(':core:shared-travel')
    implementation project(':core:persistence-core')
    implementation project(':core:security-core')
    implementation project(':core:storage-core')
    implementation project(':core:redis-core')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 소셜 로그인 provider 호출용 HTTP Interface (WebClient)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 이메일 인증코드 발송
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // 인증 메일 HTML 템플릿 렌더링 (#1062). REST 서비스라 MVC 뷰 리졸버를 끌어오는 starter 대신 엔진만 쓴다.
    implementation 'org.thymeleaf:thymeleaf'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 반려견 삭제 직후 plan-service 에 동행 목록 대사를 요청한다 (#972) — 이 서비스의 첫 서비스 간 호출이다.
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // 컨텍스트 로딩 게이트(AuthServiceApplicationTests)가 실제 DB 없이 JPA 매핑까지 조립해 본다.
    testRuntimeOnly 'com.h2database:h2'
}
