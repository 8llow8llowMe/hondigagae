# 혼디가개 auth-service 배포 정의.
#
# 배치:
#   dev  -> main-server (192.168.0.11), 호스트 포트 7081  (혼디가개 dev 는 7xxx 대역)
#   prod -> backend-1   (192.168.0.13), 호스트 포트 5081  (혼디가개 prod 는 5xxx 대역)
#
#   BossPickSeoul 이 dev 6xxx / prod 9xxx 를 이미 점유하고 있어 같은 호스트에 올리려면
#   대역을 달리해야 한다. (Infra README §4 배치 원칙 5번)
#   storage(192.168.0.12)에는 올리지 않는다 — 총 1.9GB / swap 0 에 nginx 가 함께 있어
#   OOM 이 나면 전 도메인의 인그레스가 같이 죽는다.
#
# 컨테이너 안에서 앱이 듣는 포트는 dev/prod 가 같다(8081). 호스트 포트만 다르다.
# 서비스 간 호출과 Eureka 등록은 같은 호스트의 8llow8llowme-net 브리지 안에서 컨테이너명으로 이뤄지므로,
# SERVICE_DISCOVERY_HOSTNAME 에는 사설 IP 가 아니라 discovery **컨테이너명**을 넣는다.

x-auth-service-environment: &auth_service_environment
  TIME_ZONE: ${TIME_ZONE}
  # prod 로 띄우면서 이 값이 dev 로 남아 있으면 ddl-auto:update 로
  # 운영 스키마가 배포마다 자동 변경된다. 환경별 Vault secret 에서 반드시 갈라 둔다.
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  SPRING_APPLICATION_NAME: ${AUTH_SERVICE_APP_NAME}
  AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
  # 같은 호스트 같은 브리지 안이라 컨테이너명으로 해석된다.
  # 예) dev = hondigagae-service-discovery-dev / prod = hondigagae-service-discovery-prod
  SERVICE_DISCOVERY_HOSTNAME: ${SERVICE_DISCOVERY_HOSTNAME}
  # 컨테이너 내부 포트(8761)다. 호스트 포트(7761/5761)가 아니다.
  SERVICE_DISCOVERY_PORT: ${SERVICE_DISCOVERY_PORT}
  AUTH_DB_URL: ${AUTH_DB_URL}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_MODE: ${REDIS_MODE}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  # sentinel 모드에서만 쓴다. standalone 이면 비워 둔다.
  # 노드는 host:port 콤마 구분. sentinel 인데 비어 있으면 RedisConfigurer 가 기동 시점에
  # 어떤 env 를 넣어야 하는지 적어 실패시킨다 — compose 가 넘기지 않으면 그 메시지가 나온다.
  REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-}
  REDIS_SENTINEL_NODES: ${REDIS_SENTINEL_NODES:-}
  # BossPickSeoul 과 같은 Redis 를 공유하므로 prefix 로 키 공간을 가른다.
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
  # HS512 라 64바이트 이상이어야 한다. 게이트웨이/리소스 서버와 같은 값을 쓴다.
  JWT_ACCESS_KEY: ${JWT_ACCESS_KEY}
  JWT_REFRESH_KEY: ${JWT_REFRESH_KEY}
  JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-PT1H}
  JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-P14D}
  JWT_BLACKLIST_FAIL_OPEN: ${JWT_BLACKLIST_FAIL_OPEN:-false}
  AUTH_LOGIN_MAX_FAILURE_COUNT: ${AUTH_LOGIN_MAX_FAILURE_COUNT:-5}
  AUTH_LOGIN_LOCK_DURATION: ${AUTH_LOGIN_LOCK_DURATION:-PT10M}
  # 일반 로그인 이메일 인증코드 발송용.
  MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  # 카카오는 로그인 전용이다. 지도는 클라이언트 JS SDK 가 그리고 서버는 카카오 API 를 부르지 않는다.
  OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID:-}
  OAUTH_KAKAO_CLIENT_SECRET: ${OAUTH_KAKAO_CLIENT_SECRET:-}
  # dev = https://api-dev.hondigagae.com/... , prod = https://api.hondigagae.com/...
  # 카카오 개발자센터에 등록한 값과 한 글자도 다르면 안 된다.
  OAUTH_KAKAO_REDIRECT_URI: ${OAUTH_KAKAO_REDIRECT_URI:-}
  OAUTH_NAVER_CLIENT_ID: ${OAUTH_NAVER_CLIENT_ID:-}
  OAUTH_NAVER_CLIENT_SECRET: ${OAUTH_NAVER_CLIENT_SECRET:-}
  OAUTH_NAVER_REDIRECT_URI: ${OAUTH_NAVER_REDIRECT_URI:-}
  # MinIO 는 storage(192.168.0.12) 에 있다. 다른 호스트라 컨테이너명이 아니라 사설 IP 로 접속한다.
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  # DB 에는 key 만 저장하고 응답 시 이 값으로 URL 을 조립한다.
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
  MINIO_BUCKET: ${MINIO_BUCKET}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_MAX_FILE_BYTES: ${MINIO_MAX_FILE_BYTES:-5242880}
  MULTIPART_MAX_FILE_SIZE: ${MULTIPART_MAX_FILE_SIZE:-5MB}
  # nginx 의 client_max_body_size(30M) 와 맞춘다. 여기가 더 크면 nginx 가 먼저 413 을 던진다.
  MULTIPART_MAX_REQUEST_SIZE: ${MULTIPART_MAX_REQUEST_SIZE:-30MB}
  SNOWFLAKE_DATACENTER_ID: ${SNOWFLAKE_DATACENTER_ID}
  # 서비스마다 다른 값을 준다. 겹치면 같은 ID 가 두 번 나온다.
  SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  auth-service-dev:
    image: hondigagae-auth-service:latest
    container_name: hondigagae-auth-service-dev
    labels:
      observability.project: hondigagae
      observability.group: service
      observability.service: auth-service
      observability.env: dev
      observability.application: ${AUTH_SERVICE_APP_NAME}
      observability.deployment: hondigagae-auth-service-dev
    build:
      context: .
      dockerfile: auth-service.Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT_DEV}:${AUTH_SERVICE_PORT}" # host:container
    environment:
      <<: *auth_service_environment
    # 컨테이너 메모리 상한. JVM heap 은 Dockerfile 의 MaxRAMPercentage 가 이 값을 기준으로 산정한다.
    deploy:
      resources:
        limits:
          memory: ${AUTH_SERVICE_MEM_LIMIT_DEV:-512m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

  auth-service-prod:
    image: hondigagae-auth-service:latest
    container_name: hondigagae-auth-service-prod
    labels:
      observability.project: hondigagae
      observability.group: service
      observability.service: auth-service
      observability.env: prod
      observability.application: ${AUTH_SERVICE_APP_NAME}
      observability.deployment: hondigagae-auth-service-prod
    build:
      context: .
      dockerfile: auth-service.Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT_PROD}:${AUTH_SERVICE_PORT}" # host:container
    environment:
      <<: *auth_service_environment
    deploy:
      resources:
        limits:
          memory: ${AUTH_SERVICE_MEM_LIMIT_PROD:-768m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    external: true
