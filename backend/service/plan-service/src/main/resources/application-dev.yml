server:
  port: ${PLAN_SERVICE_PORT}
  shutdown: graceful

spring:
  cloud:
    config:
      enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PLAN_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        show_sql: false
        jdbc:
          batch_size: 100
        default_batch_fetch_size: 100

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    serviceUrl:
      defaultZone: http://${SERVICE_DISCOVERY_HOSTNAME}:${SERVICE_DISCOVERY_PORT}/eureka/

# Resource Server 검증 키. auth-service 가 발급에 쓰는 JWT_ACCESS_KEY 와 같은 값을 주입한다.
app:
  security:
    jwt:
      resource:
        access-key: ${JWT_ACCESS_KEY}

snowflake:
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID}
  worker-id: ${SNOWFLAKE_WORKER_ID}

# Eureka 등록명은 환경별 접미사가 붙으므로 하드코딩하지 않고 앱 이름 env 를 참조한다.
feign-client:
  target-services:
    tour-service: ${TOUR_SERVICE_APP_NAME}
    auth-service: ${AUTH_SERVICE_APP_NAME}
