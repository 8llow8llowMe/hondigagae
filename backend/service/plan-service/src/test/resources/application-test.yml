# 컨텍스트 로딩 테스트 전용 프로파일.
# 목적은 "빈 정의가 서로 충돌하지 않고 컨텍스트가 뜨는가" 하나다. 외부 의존은 전부 끊는다.
#   - DB: H2 인메모리 (testRuntimeOnly). ddl-auto:create-drop 으로 엔티티 매핑까지 검증한다.
#   - Eureka / Config Server: 비활성. 등록·조회를 시도하면 CI 에서 네트워크로 죽는다.
#   - Feign 클라이언트는 프록시만 만들어지고 호출하지 않으므로 대상 서비스가 없어도 된다.
server:
  port: 0

spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:plan-context;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

snowflake:
  datacenter-id: 1
  worker-id: 3

app:
  security:
    jwt:
      resource:
        access-key: context-test-only-jwt-access-key-0123456789abcdef0123456789abcdef0123456789abcdef
