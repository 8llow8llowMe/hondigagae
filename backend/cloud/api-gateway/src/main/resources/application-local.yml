server:
  port: 8000
  shutdown: graceful

spring:
  cloud:
    config:
      enabled: false  # 로컬에서만 Config Server 비활성화
    gateway:
      routes:
        - id: auth-service-auth
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: auth-service-members
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/members/**
        - id: tour-service-places
          uri: lb://tour-service
          predicates:
            - Path=/api/v1/places/**
        - id: tour-service-walk-courses
          uri: lb://tour-service
          predicates:
            - Path=/api/v1/walk-courses/**
        - id: tour-service-emergencies
          uri: lb://tour-service
          predicates:
            - Path=/api/v1/emergencies/**
        # 장소에 매이지 않은 인사이트(권역 날씨 비교, 산책 골든타임).
        # /api/v1/places/** 와 달리 장소 아이디로 시작하지 않아 경로가 따로다.
        - id: tour-service-insights
          uri: lb://tour-service
          predicates:
            - Path=/api/v1/insights/**
        - id: plan-service-plans
          uri: lb://plan-service
          predicates:
            - Path=/api/v1/plans/**
        # 장소 즐겨찾기. plan-service 안에 있지만 /api/v1/plans/** 로 시작하지 않아 경로가 따로다 (#202).
        # 컨트롤러 접두어와 라우트의 대조는 GatewayRouteCoverageTest 가 세 프로파일에 대해 고정한다.
        - id: plan-service-favorites
          uri: lb://plan-service
          predicates:
            - Path=/api/v1/favorites/**
        # 일정 읽기 전용 공유 링크 (#627). 비인증으로 열리는 공개 경로라 인증이 필요한
        # /api/v1/plans/** 와 접두어를 나눴다 — "이 접두어는 공개" 가 경로만 보고 읽혀야 한다.
        - id: plan-service-shared-plans
          uri: lb://plan-service
          predicates:
            - Path=/api/v1/shared-plans/**
          # 공유 링크 레이트 리밋 (#1244). 키는 IP 가 아니라 토큰 해시라 한도는 "링크 하나당" 이다
          # (SharedPlanTokenKeyResolver). 초당 2개 보충 · 버스트 20. 세 프로파일 같은 값 — RateLimitRouteCoverageTest.
          # 기본 RequestRateLimiter 는 거부가 빈 본문이라 봉투(GATEWAY_001)를 내는 SharedPlanRateLimit 을 쓴다.
          filters:
            - name: SharedPlanRateLimit
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        - id: ai-service-ai-plans
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai-plans/**
        - id: ai-service-assistant
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/assistant/**
        # Swagger 문서용 라우트
        - id: auth-service-docs
          uri: http://localhost:8081
          predicates:
            - Path=/auth-service/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: tour-service-docs
          uri: http://localhost:8082
          predicates:
            - Path=/tour-service/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: plan-service-docs
          uri: http://localhost:8083
          predicates:
            - Path=/plan-service/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: ai-service-docs
          uri: http://localhost:8085
          predicates:
            - Path=/ai-service/v3/api-docs/**
          filters:
            - StripPrefix=1

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

jwt:
  # 로컬 개발 전용 기본 키 (HS512 — 64바이트 이상). 운영/개발 서버는 env 로 주입한다.
  access-key: ${JWT_ACCESS_KEY:hondigagae-local-jwt-access-key-0123456789abcdef0123456789abcdef0123456789abcdef}
  blacklist-fail-open: false

# Redis
infra:
  redis:
    mode: standalone
    host: localhost
    port: 6379
    password:
    key-prefix: ${REDIS_KEY_PREFIX:hondigagae:local}
    # Redis 가 먹통(패킷 드롭 · 응답 없음)일 때 빨리 실패하게 짧게 둔다 (#1253). 비우면 Lettuce 기본이다 —
    # 명령은 동기 60초 · 리액티브 무제한, 연결 10초. 그러면 레이트 리밋의 fail-open 이 일어나지 않고, 블랙리스트 판정이
    # 요청마다 60초를 기다린다. 블랙리스트 확인(EXISTS) · 레이트 리밋(Lua 스크립트) 모두 짧은 명령이라 1초면 넉넉하다.
    # 세 프로파일 같은 값 — GatewayRedisTimeoutConfigTest.
    command-timeout: 1s
    connect-timeout: 2s

# SpringDoc (Swagger) Aggregation
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: 인증/회원 서비스 API
        url: /auth-service/v3/api-docs
      - name: 관광 데이터 서비스 API
        url: /tour-service/v3/api-docs
      - name: 여행 일정 서비스 API
        url: /plan-service/v3/api-docs
      - name: AI 서비스 API
        url: /ai-service/v3/api-docs
    operationsSorter: none
    displayRequestDuration: true
