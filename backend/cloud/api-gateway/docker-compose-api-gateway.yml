# 혼디가개 api-gateway 배포 정의.
#
# 배치:
#   dev  -> main-server (192.168.0.11), 호스트 포트 7000  (혼디가개 dev 는 7xxx 대역)
#   prod -> backend-1   (192.168.0.13), 호스트 포트 5000  (혼디가개 prod 는 5xxx 대역)
#
#   BossPickSeoul 이 dev 6xxx / prod 9xxx 를 이미 점유하고 있어 같은 호스트에 올리려면
#   대역을 달리해야 한다. (Infra README §4 배치 원칙 5번)
#   storage(192.168.0.12)에는 올리지 않는다 — 총 1.9GB / swap 0 에 nginx 가 함께 있어
#   OOM 이 나면 전 도메인의 인그레스가 같이 죽는다.
#
# 컨테이너 안에서 앱이 듣는 포트는 dev/prod 가 같다(8000). 호스트 포트만 다르다.
# 서비스 간 호출과 Eureka 등록은 같은 호스트의 8llow8llowme-net 브리지 안에서 컨테이너명으로 이뤄지므로,
# SERVICE_DISCOVERY_HOSTNAME 에는 사설 IP 가 아니라 discovery **컨테이너명**을 넣는다.

x-api-gateway-environment: &api_gateway_environment
  TIME_ZONE: ${TIME_ZONE}
  # prod 로 띄우면서 이 값이 dev 로 남아 있으면 ddl-auto:update 로
  # 운영 스키마가 배포마다 자동 변경된다. 환경별 Vault secret 에서 반드시 갈라 둔다.
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  SPRING_APPLICATION_NAME: ${API_GATEWAY_APP_NAME}
  API_GATEWAY_PORT: ${API_GATEWAY_PORT}
  # 같은 호스트 같은 브리지 안이라 컨테이너명으로 해석된다.
  # 예) dev = hondigagae-service-discovery-dev / prod = hondigagae-service-discovery-prod
  SERVICE_DISCOVERY_HOSTNAME: ${SERVICE_DISCOVERY_HOSTNAME}
  # 컨테이너 내부 포트(8761)다. 호스트 포트(7761/5761)가 아니다.
  SERVICE_DISCOVERY_PORT: ${SERVICE_DISCOVERY_PORT}
  # auth-service 발급 키와 반드시 같은 값이어야 한다.
  JWT_ACCESS_KEY: ${JWT_ACCESS_KEY}
  # false = fail-closed. 블랙리스트 조회가 실패하면 503 으로 막는다.
  JWT_BLACKLIST_FAIL_OPEN: ${JWT_BLACKLIST_FAIL_OPEN:-false}
  REDIS_MODE: ${REDIS_MODE}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  # BossPickSeoul 과 같은 Redis 를 공유하므로 prefix 로 키 공간을 가른다.
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
  # lb:// 라우팅 대상이라 각 서비스의 Eureka 등록명과 정확히 같아야 한다.
  AUTH_SERVICE_APP_NAME: ${AUTH_SERVICE_APP_NAME}
  TOUR_SERVICE_APP_NAME: ${TOUR_SERVICE_APP_NAME}
  PLAN_SERVICE_APP_NAME: ${PLAN_SERVICE_APP_NAME}
  AI_SERVICE_APP_NAME: ${AI_SERVICE_APP_NAME}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  api-gateway-dev:
    image: hondigagae-api-gateway:latest
    container_name: hondigagae-api-gateway-dev
    labels:
      observability.project: hondigagae
      observability.group: cloud
      observability.service: api-gateway
      observability.env: dev
      observability.application: ${API_GATEWAY_APP_NAME}
      observability.deployment: hondigagae-api-gateway-dev
    build:
      context: .
      dockerfile: api-gateway.Dockerfile
    ports:
      - "${API_GATEWAY_PORT_DEV}:${API_GATEWAY_PORT}" # host:container
    environment:
      <<: *api_gateway_environment
    # 컨테이너 메모리 상한. JVM heap 은 Dockerfile 의 MaxRAMPercentage 가 이 값을 기준으로 산정한다.
    deploy:
      resources:
        limits:
          memory: ${API_GATEWAY_MEM_LIMIT_DEV:-512m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

  api-gateway-prod:
    image: hondigagae-api-gateway:latest
    container_name: hondigagae-api-gateway-prod
    labels:
      observability.project: hondigagae
      observability.group: cloud
      observability.service: api-gateway
      observability.env: prod
      observability.application: ${API_GATEWAY_APP_NAME}
      observability.deployment: hondigagae-api-gateway-prod
    build:
      context: .
      dockerfile: api-gateway.Dockerfile
    ports:
      - "${API_GATEWAY_PORT_PROD}:${API_GATEWAY_PORT}" # host:container
    environment:
      <<: *api_gateway_environment
    deploy:
      resources:
        limits:
          memory: ${API_GATEWAY_MEM_LIMIT_PROD:-768m}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    external: true
