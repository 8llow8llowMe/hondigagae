# 경로 → 라벨 매핑 (actions/labeler v5)
#
# **라벨은 배포 대상을 정하는 값이다.** Jenkins 가 PR 라벨로 배포 스코프를 정하고
# 라벨이 없으면 배포하지 않는다(fail-closed, `Jenkinsfile.frontend-common.groovy:13`).
# 그래서 라벨을 빠뜨린 PR 은 머지돼도 배포가 안 나간다 — #217 · #219 · #223 이 그랬다.
#
# 규칙 정본은 `docs/git-workflow.md` §4 이고, 이 파일은 그것을 자동화한다.
#
# **더하기만 한다** (`sync-labels: false`). 사람이 손으로 붙인 라벨을 지우지 않는다 —
# 지우기 시작하면 아래 `backend-core` 주석의 경우처럼 의도적으로 넓힌 스코프가 사라진다.
#
# 여기 없는 경로(루트 문서 · `Jenkinsfile*` · `.github/**` · `scripts/**`)는 라벨이
# 붙지 않는다. 저장소 공통 변경([DOCS] / [INFRA])에는 해당 라벨이 없고,
# **새로 만들지 않고 생략한다**는 것이 §4 의 규칙이다.

frontend-web:
  - changed-files:
      - any-glob-to-any-file: 'frontend/**'

# ── 백엔드 서비스 — 배포 단위가 곧 라벨이다
backend-ai-service:
  - changed-files:
      - any-glob-to-any-file: 'backend/service/ai-service/**'

backend-auth-service:
  - changed-files:
      - any-glob-to-any-file: 'backend/service/auth-service/**'

backend-batch-service:
  - changed-files:
      - any-glob-to-any-file: 'backend/service/batch-service/**'

backend-plan-service:
  - changed-files:
      - any-glob-to-any-file: 'backend/service/plan-service/**'

backend-tour-service:
  - changed-files:
      - any-glob-to-any-file: 'backend/service/tour-service/**'

backend-api-gateway:
  - changed-files:
      - any-glob-to-any-file: 'backend/cloud/api-gateway/**'

backend-service-discovery:
  - changed-files:
      - any-glob-to-any-file: 'backend/cloud/service-discovery/**'

# **`backend-core` 는 배포 라벨이 아니다.**
#
# 공용 모듈이라 바뀌면 그것을 쓰는 서비스 전부의 런타임이 바뀌는데, Jenkins 의 배포
# 스코프는 `backend-{service}` 단위다. 그래서 이 라벨만 붙은 PR 은 **아무 서비스도
# 배포되지 않는다.**
#
# 그렇다고 여기서 5개 서비스 라벨을 다 붙이지는 않는다 — "의도한 대상만 배포한다" 가
# fail-closed 설계의 요점이고, 자동으로 전체 배포를 열면 그 설계가 무너진다.
# **core 를 건드린 PR 의 작성자가 배포할 서비스 라벨을 직접 더한다** (§4).
backend-core:
  - changed-files:
      - any-glob-to-any-file: 'backend/core/**'

backend-docs:
  - changed-files:
      - any-glob-to-any-file: 'backend/docs/**'
