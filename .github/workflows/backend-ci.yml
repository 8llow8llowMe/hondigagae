name: backend-ci

# **백엔드 PR 에서 테스트를 돌린다** (이슈 #764).
#
# 이 워크플로가 생기기 전까지 `backend/**` 만 바꾼 PR 에서 도는 체크는 `label` 하나였다.
# 초록불이 "테스트가 통과했다" 가 아니라 "라벨이 붙었다" 를 뜻했는데 그렇게 읽히지 않았다.
#
# **Jenkins 는 PR 빌드에서 이미 테스트를 돈다** — `Jenkinsfile.backend-common.groovy:742`
# 가 `RUN_TESTS`(기본 true)일 때 `:{module}:test` 를 실행한다. 다만 그 결과가 GitHub PR
# 체크로 올라오지 않아 **PR 화면에서는 보이지 않는다.** 그리고 Jenkins 는 라벨이 가리키는
# **한 모듈만** 돈다. 이 워크플로는 결과를 PR 에 보이게 하고, core 가 바뀐 PR 과 develop 은 전 모듈을 본다.

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'scripts/classify-backend-changes.sh'
  # **develop 에서도 돈다 — 캐시 때문이다** (이슈 #830).
  #
  # Actions 는 **기본 브랜치 스코프 캐시만 모든 PR 이 상속**한다. `pull_request` 실행이
  # 저장한 캐시는 `refs/pull/N/merge` 스코프라 그 PR 안에서만 읽힌다. 이 트리거가 없으면
  # develop 에서 한 번도 돌지 않아 base 스코프 캐시가 **아예 생기지 않고**, 매 PR 이
  # 항상 콜드 캐시가 된다. 실제로 그랬다 — 캐시 43개가 전부 `refs/pull/*` 였다.
  #
  # 겸사겸사 머지된 develop 자체를 검사한다. `pull_request` 는 머지 **전** 트리를 보므로
  # 머지 후 develop 이 빨간불이 된 것은 아무도 보지 않았다 (#282).
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'scripts/classify-backend-changes.sh'

# 같은 PR 에 새 커밋이 올라오면 이전 실행을 버린다. 백엔드 check 는 분 단위라
# rebase 를 몇 번 하면 러너에 겹쳐 쌓인다.
# (`frontend-ci.yml` 에는 아직 이 블록이 없다 — 거기에도 넣을지는 별도 판단이다.)
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # **PR 은 바뀐 모듈만, develop 은 전 모듈 `check` 를 돈다** (#1211).
  #
  # 전에는 PR 도 전 모듈이었다(#764). `ai-service` 하나만 바꾼 PR 이 auth · batch · plan · tour ·
  # gateway · discovery 테스트까지 다 돌아 3분 안팎을 쓰고, 문서만 바꾼 PR 도 같았다. 전 모듈의
  # 근거는 "`core/common-core` 의 `GeoDistance` 처럼 여러 서비스가 함께 쓰는 코드" 였는데, 그것은
  # **core 가 바뀐 PR 에서만** 성립한다 — 서비스 모듈끼리는 컴파일 의존이 없다.
  #
  # 그래서 범위는 `scripts/classify-backend-changes.sh` 가 바뀐 경로로 정한다 — 서비스 · cloud 만 바뀌면
  # 그 모듈만, core · 빌드 설정 · 이 워크플로 · 모르는 경로면 전 모듈, 문서만이면 건너뛴다. 모듈 목록을
  # 따로 적지 않고 디렉터리 = 모듈로 읽는다(네 번째 사본을 만들지 않는다 — 스크립트 머리말).
  # **판정이 실패하면 전 모듈이다** — 모르는 것을 "안 바뀌었다" 로 읽지 않는다.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # **검사 범위를 정한다** (#1211). 출력 `tasks` 는 Gradle 인자(`check` 또는 `:service:<x>:check …`)이거나
      # `none`(문서만 — 아래 단계를 모두 건너뛴다)이다.
      #
      # PR 체크아웃은 base 위에 PR 을 얹은 머지 커밋이라 base 와의 차이가 곧 PR 의 변경이다(`frontend-ci.yml`
      # 의 `changes` 잡과 같은 방식). develop push 는 판정하지 않고 언제나 전 모듈이다(#830).
      # 스크립트가 모듈 디렉터리가 있는지 보므로 저장소 루트에서 돈다.
      #
      # diff 를 먼저 받아 두고 넘긴다 — 파이프로 바로 이으면(`run` 기본 셸은 pipefail 이 없다) diff 가 실패해도
      # 스크립트는 빈 입력을 받아 `none` 을 내고, 실패가 "문서만 바뀌었다" 로 읽혀 검사를 건너뛴다.
      - name: 검사 범위 정하기
        id: scope
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          tasks=check
          if [ "$EVENT_NAME" = "pull_request" ] \
            && git fetch --quiet --depth=1 origin "$BASE_SHA" \
            && changed=$(git -c core.quotepath=off diff --name-only "$BASE_SHA" HEAD); then
            tasks=$(printf '%s\n' "$changed" | sh scripts/classify-backend-changes.sh) || tasks=check
            [ -n "$tasks" ] || tasks=check
          fi
          echo "tasks=$tasks" | tee -a "$GITHUB_OUTPUT"
          {
            echo '## 백엔드 검사 범위'
            echo
            if [ "$tasks" = none ]; then
              echo '문서만 바뀌어 Gradle 을 건너뛰었다.'
            else
              echo "\`./gradlew $tasks\`"
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # 루트 `build.gradle` 의 toolchain 이 Java 21 이다.
      #
      # **`cache: gradle` 을 쓰지 않는다.** 그 옵션은 `~/.gradle/caches` 를 통째로 담는데
      # 거기에 `build-cache-1` 이 들어 있다. 그러면 다음 실행에서 test 태스크가
      # `FROM-CACHE` 로 건너뛰어져 **테스트가 한 건도 안 돈 채 초록불이 난다** —
      # `backend/docs/done-checklist.md` §1 이 로컬에서 경고하는 함정이 CI 에서 그대로
      # 재현된다. 캐시는 아래에서 의존성만 따로 담는다.
      - uses: actions/setup-java@v4
        if: ${{ steps.scope.outputs.tasks != 'none' }}
        with:
          distribution: temurin
          java-version: '21'

      # 의존성(`modules-2`)과 wrapper 배포본만 캐시한다. 빌드 산출물·테스트 결과는 담지 않는다.
      - name: Cache Gradle dependencies
        if: ${{ steps.scope.outputs.tasks != 'none' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-deps-${{ runner.os }}-

      # `chmod +x gradlew` 를 두지 않는다 — `backend/gradlew` 가 git 에 `100644` 로
      # 들어가 있던 것이 원인이라 모드를 `100755` 로 고쳤다. Jenkins 는 매 빌드마다
      # `chmod +x` 로 덮어쓰고 있어서(`Jenkinsfile.backend-common.groovy:740`) 이 결함이
      # 드러나지 않았다. 여기서 또 chmod 하면 같은 것을 두 번 가리게 된다.
      #
      # `--no-build-cache` 는 위 캐시 제외와 같은 목적의 이중 안전장치다.
      # `backend/gradle.properties` 가 `org.gradle.caching=true` 를 켜 두므로 명시로 끈다.
      #
      # 로컬과 달리 `cleanTest` 는 필요 없다 — 러너는 매번 새 체크아웃이라 `build/` 가
      # 없고, `UP-TO-DATE` 로 건너뛸 이전 산출물 자체가 존재하지 않는다. 남는 경로가
      # 빌드 캐시 하나였고 그것을 위에서 끊었다. **그래도 믿지 않고 다음 단계에서 센다.**
      #
      # `TASKS` 를 따옴표 없이 펼친다 — `:service:ai-service:check :service:plan-service:check` 처럼 여러
      # 태스크가 인자 여럿으로 나뉘어야 한다. 값은 위 단계가 정한 것뿐이다.
      - name: Gradle check
        id: gradle
        if: ${{ steps.scope.outputs.tasks != 'none' }}
        env:
          TASKS: ${{ steps.scope.outputs.tasks }}
        run: ./gradlew $TASKS --no-build-cache --stacktrace

      # **초록불이 거짓인지 확인한다.**
      #
      # 이 이슈의 출발점이 "돌았다고 믿었는데 안 돌았다" 이므로, 통과 여부와 별개로
      # **몇 건이 실제로 실행됐는지**를 세어 PR 요약에 남긴다. 통과했는데 0건이면
      # 그 초록불은 거짓이므로 여기서 떨어뜨린다.
      - name: 실행된 테스트 건수 집계
        if: ${{ !cancelled() && steps.scope.outputs.tasks != 'none' }}
        env:
          GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET

          total = failures = errors = skipped = 0
          modules = {}
          for path in glob.glob('**/build/test-results/test/*.xml', recursive=True):
              root = ET.parse(path).getroot()
              count = int(root.get('tests', 0))
              total += count
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
              module = path.replace(os.sep, '/').split('/build/test-results')[0]
              modules[module] = modules.get(module, 0) + count

          lines = ['| 모듈 | 실행 건수 |', '|------|----------:|']
          lines += ['| `%s` | %d |' % (m, modules[m]) for m in sorted(modules)]
          lines.append('| **합계** | **%d** |' % total)
          lines.append('')
          lines.append('실패 %d · 오류 %d · 건너뜀 %d' % (failures, errors, skipped))

          summary = '\n'.join(lines)
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fp:
              fp.write('## 백엔드 테스트 실행 결과\n\n' + summary + '\n')

          # check 가 이미 실패했다면 원인은 그쪽이다. 0건을 덧씌워 혼란을 주지 않는다.
          if total == 0 and os.environ.get('GRADLE_OUTCOME') == 'success':
              sys.exit('테스트가 한 건도 실행되지 않았는데 check 가 통과했다 — '
                       '캐시로 건너뛰었을 수 있다. 이 초록불은 믿을 수 없다.')
          PY

      # `working-directory` 는 액션 입력에 적용되지 않는다 (`frontend-ci.yml` 의 같은 함정).
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/**/build/reports/tests/test/
            backend/**/build/test-results/test/
          retention-days: 7
