name: label

# **라벨을 사람 손에 맡기지 않는다.**
#
# 배포 대상은 PR 라벨로 정해지고 라벨이 없으면 배포가 나가지 않는다(fail-closed).
# 규칙은 `docs/git-workflow.md` §4 에 "필수" 로 적혀 있지만, 붙이지 않아도 머지되므로
# 실제로 빠뜨린 PR 이 여러 건 있었다 — #217 · #219 · #223.
#
# 매핑은 `.github/labeler.yml` 이다.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 기본 토큰은 읽기 전용이다. 라벨을 붙이려면 이 권한이 필요하다
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # 포크에서 온 PR 은 `pull_request` 토큰이 읽기 전용이라 라벨을 붙이지 못한다.
      # 이 저장소는 포크 없이 브랜치로 작업하므로(`docs/git-workflow.md` §3)
      # `pull_request_target` 을 쓰지 않는다 — 그쪽은 base 의 권한으로 돌아 더 위험하다.
      - uses: actions/labeler@v5
        with:
          # **더하기만 한다.** 사람이 넓혀 둔 스코프를 지우지 않는다 (labeler.yml 주석)
          sync-labels: false
