# 혼디가개 프론트(Next.js SSR) 배포 정의.
#
# 배치:
#   dev  -> main-server (192.168.0.11), 호스트 포트 7300 (혼디가개 dev 는 7xxx 대역)
#   prod -> backend-1   (192.168.0.13), 호스트 포트 5300 (혼디가개 prod 는 5xxx 대역)
#   storage(192.168.0.12)에는 올리지 않는다. 총 메모리 1.9GB / swap 0 에 nginx·MinIO·redis-node3 가
#   함께 있어 OOM 이 나면 전 도메인의 인그레스가 같이 죽는다.
#
# ⚠️ NEXT_PUBLIC_* 는 여기에 두지 않는다.
#    Next.js 는 NEXT_PUBLIC_* 를 **빌드 시점에 코드로 인라인**하므로 런타임 주입은 무시된다.
#    이 값들은 Jenkins 빌드 단계에서 Vault 로부터 주입된다. (Jenkinsfile.frontend-common.groovy)
#    여기 있는 것은 서버에서만 읽는 값(BFF 세션 키, 백엔드 주소)뿐이다.
#
# MOCK_API 는 두지 않는다. src/lib/api/mock 이 NODE_ENV=production 이면 값과 무관하게
# 항상 비활성이므로, 운영 compose 에 남겨두면 켜질 수 있다는 오해만 만든다.
x-frontend-web-environment: &frontend_web_environment
  TZ: ${TIME_ZONE}
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: '1'
  # BFF 세션 암호화 키. 32자 이상이어야 한다 (src/lib/env.server.ts 가 zod 로 검증).
  # 환경당 한 번만 만들어 고정한다 — 바뀌면 기존 세션 쿠키를 복호화할 수 없어 전원 로그아웃된다.
  SESSION_SECRET: ${SESSION_SECRET}
  # 서버 컴포넌트/Route Handler(BFF)가 호출할 백엔드 주소.
  # 사설 IP 가 아니라 공개 도메인을 쓴다. auth API(/api/v1/auth, /api/v1/members)는
  # 게이트웨이를 거치지 않고 auth-service 로 직결되며 그 분기를 nginx 가 하기 때문이다.
  #   dev  = https://api-dev.hondigagae.com
  #   prod = https://api.hondigagae.com
  BACKEND_BASE_URL: ${BACKEND_BASE_URL}
  # og:image 절대 URL 과 canonical 의 기준 도메인 (app/layout.tsx 의 metadataBase).
  # 서버에서만 읽으므로 NEXT_PUBLIC_ 이 아니고 런타임 주입으로 충분하다.
  # 비면 http://localhost:3000 으로 떨어져 카카오톡·트위터 공유 카드가 깨진다.
  #   dev  = https://dev.hondigagae.com
  #   prod = https://www.hondigagae.com
  SITE_BASE_URL: ${SITE_BASE_URL}

x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '5m'
    max-file: '2'

services:
  frontend-web-dev:
    image: hondigagae-frontend-web:latest
    container_name: hondigagae-frontend-web-dev
    labels:
      observability.project: hondigagae
      observability.group: frontend
      observability.service: frontend-web
      observability.env: dev
      observability.application: hondigagae-frontend-web
      observability.deployment: hondigagae-frontend-web-dev
    build:
      context: .
      dockerfile: frontend-web.Dockerfile
    # 호스트 포트를 환경 접미사 없이 한 이름으로 받는다.
    # 이 파일 하나에 dev/prod 서비스가 같이 정의되어 있어 `docker compose config` 가
    # 배포하지 않는 쪽까지 해석하는데, 이름을 나누면 그쪽 값도 Vault 에 넣어야 한다.
    # 같은 이름을 쓰면 각 환경의 .env.runtime 에 있는 값 하나로 둘 다 해석되고,
    # 실제로 기동하는 서비스는 파이프라인이 지정한 하나뿐이다.
    ports:
      - '${FRONTEND_WEB_PORT}:3000' # host:container
    environment:
      <<: *frontend_web_environment
    # Node 는 JVM 과 달리 컨테이너 상한을 heap 에 자동 반영하지 않는다.
    # 상한에 근접하면 GC 대신 OOM kill 이 나므로 old space 를 명시적으로 낮춰 잡는다.
    # FRONTEND_WEB_MEM_LIMIT 의 70~75% 다. Vault 에서 상한을 바꾸면 이 값도 함께 조정한다.
    # (환경변수로 빼지 않는 이유: 비밀도 아니고 환경별로 다를 값도 아니라 코드에 남기는 게 낫다)
    command: ['node', '--max-old-space-size=384', 'server.js']
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_WEB_MEM_LIMIT}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

  frontend-web-prod:
    image: hondigagae-frontend-web:latest
    container_name: hondigagae-frontend-web-prod
    labels:
      observability.project: hondigagae
      observability.group: frontend
      observability.service: frontend-web
      observability.env: prod
      observability.application: hondigagae-frontend-web
      observability.deployment: hondigagae-frontend-web-prod
    build:
      context: .
      dockerfile: frontend-web.Dockerfile
    # 이름을 dev 와 공유하는 이유는 frontend-web-dev 의 ports 주석 참고.
    ports:
      - '${FRONTEND_WEB_PORT}:3000' # host:container
    environment:
      <<: *frontend_web_environment
    # 값 산정 기준은 frontend-web-dev 의 command 주석 참고.
    command: ['node', '--max-old-space-size=576', 'server.js']
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_WEB_MEM_LIMIT}
    restart: unless-stopped
    logging:
      <<: *default-logging
    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    external: true
