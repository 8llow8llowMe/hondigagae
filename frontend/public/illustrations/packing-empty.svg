<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 56" role="img" aria-hidden="true">
  <!--
    준비물 빈 상태의 자리 채움 (#841). #878d96 은 styles/tokens.css 의 `fg-subtle` 토큰
    (CSS 변수라 실제 이름 앞에는 하이픈 둘이 붙는다) 과 같은 값이다 — 그 토큰이
    "placeholder·비활성·장식 전용" 으로 정의한 톤이고 이것이 장식이다. 변수로 참조할 수는
    없다: <img> 로 그려서 문서의 CSS 변수가 닿지 않는다. 토큰이 바뀌면 이 값을 손으로
    맞춰야 한다 (token-usage.test.ts 는 .ts(x) 만 훑는다).

    **이 주석 안에 하이픈 둘을 연달아 적지 마라** (#845). XML 주석은 그 문자열을 담을 수
    없어 파일 전체가 파싱 실패하고, `img` 로 그리는 SVG 는 엄격 XML 파서를 타므로 그대로
    깨진 이미지가 된다 — 빌드도 린터도 잡지 않고 화면에서만 드러난다. 실제로 그렇게 나가서
    #845 가 됐다. 그래서 위에서 토큰 이름을 하이픈 없이 적었다.
    svg-assets.test.ts 가 이 폴더 전체를 잠근다.
  -->
  <g fill="none" stroke="#878d96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 17v-5a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v5"/>
    <rect x="8" y="17" width="48" height="31" rx="4"/>
    <path d="M32 17v31"/>
  </g>
</svg>
